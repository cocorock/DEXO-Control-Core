# =====================================================================
# DEXO Control Core - 2 Motor Configuration
# Configuration for motor_control_node_2motors and trajectory_generator
# =====================================================================

# =====================================================================
# MOTOR CONTROL CONFIGURATION
# =====================================================================

# Calibration Parameters
calibration:
  sequence: [1, 2]               # Calibration order: Right hip (1), Right knee (2)
  speed_deg: 90.0                # Calibration speed in degrees/second (0.52 rad/s)
  max_time: 30.0                 # Maximum calibration time in seconds
  torque_thresholds: [2.0, 2.3]  # Torque thresholds [hip, knee] in Nm
  
  # Compensation torques for structural weight during calibration
  # Format: [negative_limit_torque, positive_limit_torque] per motor (standard order)
  # negative_limit_torque: torque applied when moving to negative limit (typically negative value)
  # positive_limit_torque: torque applied when moving to positive limit (typically positive value)
  compensation_torques:
    right_hip:  [0.0, 0.0] #[6.0, 12.0]      # [-Nm, +Nm] for negative/positive limit directions
    right_knee: [1.0, 1.0]  #[7.0, 0.0]     # [-Nm, +Nm] for negative/positive limit directions

# Motor Hardware Configuration
motors:
  ids: [0x06, 0x08]              # CAN IDs: [Right hip, Right knee]
  joint_names: ['right_hip', 'right_knee']
  models: ['AK80_64', 'AK80_8']  # Motor models
  directions: [-1, 1]             # Direction multipliers
  
  # Joint angle limits in degrees [min, max]
  angle_limits_deg:
    - [-31, 84]   # Right hip: for negative/positive limit directions
    - [-92, 0]   # Right knee: for negative/positive limit directions

# Control Gains per Motor
control_gains:
  right_hip:
    calibration: {kp: 5.0, kd: 3.0}
    hold:        {kp: 2.0, kd: 1.5}
    trajectory:  {kp: 30.0, kd: 0.0}
  
  right_knee:
    calibration: {kp: 5.0, kd: 5.0}
    hold:        {kp: 2.0, kd: 1.5}
    trajectory:  {kp: 20.0, kd: 0.50}

# =====================================================================
# TRAJECTORY GENERATOR CONFIGURATION
# =====================================================================

trajectory_generator:
  # Timing Configuration
  control_frequency: 200         # Hz, synchronized with motor control
  
  # Leg Kinematics (meters)
  leg_parameters:
    L1: 0.38                     # Thigh length (hip to knee)
    L2: 0.42                     # Shin length (knee to ankle)
  
  # Joint limits are defined in motors.angle_limits_deg section above
  
  # Trajectory Data Configuration
  trajectory_file: 'gait_data_39_1.json'    # Trajectory data file name
  loop_trajectory: true                      # Loop trajectory continuously
  trajectory_scale: 1.0                      # Scaling factor for trajectory positions
  
  # State-based Output Values
  output_values:
    ready_state:   [0.0, 0.0, 0.0, 0.0]  # [hip_pos, knee_pos, hip_vel, knee_vel]
    walking_state: "trajectory_data"       # Use actual trajectory data
    stopping_state: [1.0, -1.0, 0.0, 0.0] # Safe stopping position